services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dfts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in .env}
      DFTS_APP_PASSWORD: ${DFTS_APP_PASSWORD:?Set DFTS_APP_PASSWORD in .env}
      DFTS_MIGRATION_PASSWORD: ${DFTS_MIGRATION_PASSWORD:?Set DFTS_MIGRATION_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/01_roles.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dfts"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dfts_app:${DFTS_APP_PASSWORD}@db:5432/dfts
      DFTS_BOOTSTRAP_TOKEN: ${DFTS_BOOTSTRAP_TOKEN:-}
    ports:
      - "8501:8501"
    volumes:
      - barcode_data:/app/barcodes

  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://dfts_owner:${DFTS_MIGRATION_PASSWORD}@db:5432/dfts
    command: ["python", "scripts/migrate.py"]

volumes:
  postgres_data:
  barcode_data:
